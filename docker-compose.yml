services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jumpbot
      POSTGRES_USER: jumpbot
      POSTGRES_PASSWORD: jumpbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jumpbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn jumpbot.api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    env_file: .env
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A jumpbot.worker.celery_app worker --loglevel=INFO --concurrency=1

  bot:
    build: .
    env_file: .env
    volumes:
      - storage_data:/data/storage
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: python -m jumpbot.bot.main

volumes:
  postgres_data:
  storage_data:
